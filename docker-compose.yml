services:
  postgres:
    image: postgres:18-alpine
    container_name: centralhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centralhub
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_18:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: centralhub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@centralhub.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data_18:
